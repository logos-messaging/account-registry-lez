[package]
name = "account-registry-relay"
description = "Publish other accounts' signed logs to the registry, paying the fee: onboarding before an account holds funds."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "account-relay"
path = "src/main.rs"

[dependencies]
account-log.workspace = true
account-registry-client.workspace = true
base64.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tiny_http.workspace = true
ureq.workspace = true
url.workspace = true
