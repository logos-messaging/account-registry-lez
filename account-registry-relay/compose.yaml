# An account relay for the public testnet. Copy .env.example to .env, set ACCOUNT_REGISTRY_PAYER,
# then `docker compose up -d`.
name: account-relay

services:
  relay:
    build:
      context: ..
      dockerfile: account-registry-relay/Dockerfile
    image: account-relay:local
    environment:
      SEQUENCER_URL: ${SEQUENCER_URL:-https://testnet.lez.logos.co}
      ACCOUNT_REGISTRY_PROGRAM: ${ACCOUNT_REGISTRY_PROGRAM:-BHNNfnhPMNMZ7N3oAtbu1iM1HkFyraWx2UjBvxhj8wTa}
      ACCOUNT_REGISTRY_PAYER: ${ACCOUNT_REGISTRY_PAYER:-}
      ACCOUNT_RELAY_AUTH: ${ACCOUNT_RELAY_AUTH:-open}
      ACCOUNT_RELAY_TOKEN: ${ACCOUNT_RELAY_TOKEN:-}
      ACCOUNT_RELAY_MAX_APPENDS_PER_DAY: ${ACCOUNT_RELAY_MAX_APPENDS_PER_DAY:-2}
      ACCOUNT_RELAY_MAX_PER_HOUR: ${ACCOUNT_RELAY_MAX_PER_HOUR:-30}
      ACCOUNT_RELAY_MAX_PER_DAY: ${ACCOUNT_RELAY_MAX_PER_DAY:-200}
      ACCOUNT_RELAY_MAX_LOG_BYTES: ${ACCOUNT_RELAY_MAX_LOG_BYTES:-4096}
      ACCOUNT_RELAY_MIN_BALANCE: ${ACCOUNT_RELAY_MIN_BALANCE:-70000000}
    ports:
      - "9010:9010"
      - "127.0.0.1:9464:9464"
    volumes:
      - relay-state:/state
    restart: unless-stopped

volumes:
  relay-state:
