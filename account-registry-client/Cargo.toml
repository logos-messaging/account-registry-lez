[package]
name = "account-registry-client"
description = "Read and write account logs on a Logos Execution Zone, verified end to end."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
account-log.workspace = true
lee.workspace = true
logos-account.workspace = true
account-registry-core.workspace = true
account-registry-methods = { workspace = true, optional = true }
base64.workspace = true
lee_core.workspace = true
program_loader_core = { workspace = true, optional = true }
risc0-binfmt = { workspace = true, optional = true }
risc0-zkos-v1compat = { workspace = true, optional = true }
borsh = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
account-registry-program.workspace = true
# Only to check `rpc::LeeTransaction` encodes exactly like LEZ's own; it pulls in tokio.
lez_common.workspace = true

[features]
default = ["deploy"]
# Embeds the guest to deploy it, which builds it with the RISC Zero toolchain.
deploy = [
    "dep:account-registry-methods",
    "dep:program_loader_core",
    "dep:risc0-binfmt",
    "dep:risc0-zkos-v1compat",
]

[[example]]
name = "account_publish"
required-features = ["deploy"]
