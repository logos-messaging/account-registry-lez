[workspace]
resolver = "3"
members = [
    "account-registry-lezprogram/core",
    "account-registry-lezprogram/program",
    "account-registry-lezprogram/methods",
    "account-registry-client",
    "account-registry-cli",
    "account-registry-relay",
]
# The guest is its own workspace, so its Cargo.lock alone decides what goes into the image.
exclude = ["account-registry-lezprogram/methods/guest"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
account-registry-core = { path = "account-registry-lezprogram/core" }
account-registry-program = { path = "account-registry-lezprogram/program" }
account-registry-methods = { path = "account-registry-lezprogram/methods" }
account-registry-client = { path = "account-registry-client" }

# One revision for every LEZ crate: the program, the client and the sequencer must agree on the
# protocol. Bump them together, and with them the guest's `lee_core`
# (account-registry-lezprogram/methods/guest/Cargo.toml).
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2" }
lez_common = { package = "common", git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.2" }

# The log format. The program links it, so the chain accepts exactly what readers accept.
account-log = { git = "https://github.com/logos-messaging/libchat", rev = "80124073090287fedc4172a492f9447ffad1782f" }
logos-account = { package = "account", git = "https://github.com/logos-messaging/libchat", rev = "80124073090287fedc4172a492f9447ffad1782f" }


base64 = "0.22.1"
borsh = "1.5.7"
clap = { version = "4.5", features = ["derive", "env"] }
# The versions LEZ v0.3.2 resolves; the program loader accepts only its default kernel.
risc0-binfmt = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
risc0-build = "3.0.5"
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"
prometheus-client = "0.26"
# The relay's libp2p listener: TCP, Noise and mplex, as Logos Core's libp2p_module speaks.
libp2p = { version = "0.56", default-features = false, features = ["tcp", "noise", "request-response", "identify", "ping", "macros", "tokio", "ed25519", "secp256k1"] }
libp2p-mplex = "0.43.1"
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# Blocking HTTP for the client's JSON-RPC: no async runtime anywhere in the client.
ureq = { version = "3.5.1", default-features = false, features = ["json", "rustls"] }
url = "2.5.4"
