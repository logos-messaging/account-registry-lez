[package]
name = "account-registry-guest"
# The program version: core, program and the guest share it.
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# A workspace of its own, excluded from the root one, so the guest's Cargo.lock pins exactly what
# is compiled into the image, and with it the program ID. Updating the root lockfile cannot move
# the ID.
[workspace]

[dependencies]
# Must match the root workspace's pin; the program crate inherits that one.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
account-registry-core = { path = "../../core" }
account-registry-program = { path = "../../program" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
