name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GUEST_MANIFEST: account-registry-lezprogram/methods/guest/Cargo.toml

jobs:
  versions:
    name: Program Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: ./check-program-version

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path "$GUEST_MANIFEST" --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RISC0_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            account-registry-lezprogram/methods/guest
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --manifest-path "$GUEST_MANIFEST" --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: ./.github/actions/install-risc0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  sequencer:
    name: Sequencer Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR_SEQUENCER: ${{ github.workspace }}/.sequencer-target
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: ./.github/actions/install-risc0
      - uses: Swatinem/rust-cache@v2
        with:
          key: sequencer
      - uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR_SEQUENCER }}
          key: sequencer-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install the sequencer's system libraries
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Start sequencer
        run: |
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR_SEQUENCER" ./run-local-sequencer > sequencer.log 2>&1 &
          curl -so /dev/null --retry-connrefused --retry 360 --retry-delay 10 http://127.0.0.1:3040 &
          wait -n
      - run: cargo test --locked -p account-registry-cli -- --ignored against_a_sequencer
      - if: failure()
        run: tail -n 200 sequencer.log

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked
